[package]
name = "gitdock"
version = "0.1.0"
description = "A focused multi-repository Git desktop client"
authors = ["GitDock"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "gitdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
trash = "5"
